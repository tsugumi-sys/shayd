version: '3'

tasks:
  fmt:
    desc: Check Rust formatting.
    cmds:
      - cargo fmt --check

  check:
    desc: Type-check all targets.
    cmds:
      - cargo check --all-targets --all-features

  clippy:
    desc: Lint all targets with Clippy.
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings

  static:
    desc: Run static checks only.
    cmds:
      - task: fmt
      - task: check
      - task: clippy
